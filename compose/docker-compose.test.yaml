services:
  snowflake-tls:
    container_name: chat-app-snowflake-tls-service
    image: ilikeblue/snowflake-uuid:dev-latest
    labels:
      - 'custom.project=chat'
      - 'custom.service=snowflake'
      - 'custom.option=TLS'
    ports:
      - "9000:80"
    environment:
      - WORKER_ID=1
      - CERT_DIR=/etc/certs
      - EPOCH=1654041600000
    volumes:
      - ../environments/test/snowflake/ssl/certs:/etc/certs:ro 
    networks:
      - chat-app-id-generator-network
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:80", "-tls", "-tls-ca-cert=/etc/certs/ca_cert.pem", "-tls-client-cert=/etc/certs/client_cert.pem", "-tls-client-key=/etc/certs/client_key.pem"]
      interval: 5s
      timeout: 5s
      retries: 5

  snowflake-non-tls:
    container_name: chat-app-snowflake-non-tls-service
    image: ilikeblue/snowflake-uuid:dev-latest
    labels:
      - 'custom.project=chat'
      - 'custom.service=snowflake'
      - 'custom.option=non-TLS'
    ports:
      - "9001:80"
    networks:
      - chat-app-id-generator-network
    environment:
      - WORKER_ID=2 
      - EPOCH=1654041600000
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:80"]
      interval: 5s
      timeout: 5s
      retries: 5


  pgdb:
    container_name: chat-app-db-service
    image: postgres:13.5
    labels:
      - 'custom.project=chat'
      - 'custom.service=database'
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=testpass123
      - POSTGRES_DB=chat-app
    ports:
      - "6000:5432"
    volumes:
      - chat-app-db-data:/var/lib/postgresql/data
    networks:
      - chat-app-db-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "chat-app"]
      interval: 5s
      timeout: 5s
      retries: 5

  controller-1:
    image: apache/kafka:latest
    container_name: chat-app-kafka-controller-1
    labels:
      - 'custom.project=chat'
      - 'custom.service=controller'
      - 'custom.option=1'
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller
      - KAFKA_LISTENERS=CONTROLLER://:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@chat-app-kafka-controller-1:9093,2@chat-app-kafka-controller-2:9093,3@chat-app-kafka-controller-3:9093
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    networks:
      - chat-app-kafka-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-controller controller-1:9093 || exit 1"]
      retries: 3
      start_period: 15s
      start_interval: 3s
      interval: 30s
      timeout: 5s

  controller-2:
    image: apache/kafka:latest
    container_name: chat-app-kafka-controller-2
    labels:
      - 'custom.project=chat'
      - 'custom.service=controller'
      - 'custom.option=2'
    environment:
      - KAFKA_NODE_ID=2
      - KAFKA_PROCESS_ROLES=controller
      - KAFKA_LISTENERS=CONTROLLER://:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@chat-app-kafka-controller-1:9093,2@chat-app-kafka-controller-2:9093,3@chat-app-kafka-controller-3:9093
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    networks:
      - chat-app-kafka-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-controller controller-2:9093 || exit 1"]
      retries: 3
      start_period: 15s
      start_interval: 3s
      interval: 30s
      timeout: 5s

  controller-3:
    image: apache/kafka:latest
    container_name: chat-app-kafka-controller-3
    labels:
      - 'custom.project=chat'
      - 'custom.service=controller'
      - 'custom.option=3'
    environment:
      - KAFKA_NODE_ID=3
      - KAFKA_PROCESS_ROLES=controller
      - KAFKA_LISTENERS=CONTROLLER://:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@chat-app-kafka-controller-1:9093,2@chat-app-kafka-controller-2:9093,3@chat-app-kafka-controller-3:9093
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    networks:
      - chat-app-kafka-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-controller controller-3:9093 || exit 1"]
      retries: 3
      start_period: 15s
      start_interval: 3s
      interval: 30s
      timeout: 5s

  broker-1:
    image: apache/kafka:latest
    container_name: chat-app-kafka-broker-1
    labels:
      - 'custom.project=chat'
      - 'custom.service=broker'
      - 'custom.option=1'
    environment:
      - KAFKA_NODE_ID=4
      - KAFKA_PROCESS_ROLES=broker
      - KAFKA_LISTENERS=PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://broker-1:19092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@chat-app-kafka-controller-1:9093,2@chat-app-kafka-controller-2:9093,3@chat-app-kafka-controller-3:9093
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
    ports:
      - 29092:9092
    networks:
      - chat-app-kafka-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server broker-1:19092 || exit 1"]
      retries: 3
      start_period: 15s
      start_interval: 3s
      interval: 30s
      timeout: 5s
    depends_on:
      - controller-1
      - controller-2
      - controller-3

  broker-2:
    image: apache/kafka:latest
    container_name: chat-app-kafka-broker-2
    labels:
      - 'custom.project=chat'
      - 'custom.service=broker'
      - 'custom.option=2'
    environment:
      - KAFKA_NODE_ID=5
      - KAFKA_PROCESS_ROLES=broker
      - KAFKA_LISTENERS=PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://broker-2:19092,PLAINTEXT_HOST://localhost:39092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@chat-app-kafka-controller-1:9093,2@chat-app-kafka-controller-2:9093,3@chat-app-kafka-controller-3:9093
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
    ports:
      - 39092:9092
    networks:
      - chat-app-kafka-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server broker-2:19092 || exit 1"]
      retries: 3
      start_period: 15s
      start_interval: 3s
      interval: 30s
      timeout: 5s
    depends_on:
      - controller-1
      - controller-2
      - controller-3

  broker-3:
    image: apache/kafka:latest
    container_name: chat-app-kafka-broker-3
    labels:
      - 'custom.project=chat'
      - 'custom.service=broker'
      - 'custom.option=3'
    environment:
      - KAFKA_NODE_ID=6
      - KAFKA_PROCESS_ROLES=broker
      - KAFKA_LISTENERS=PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://broker-3:19092,PLAINTEXT_HOST://localhost:49092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@chat-app-kafka-controller-1:9093,2@chat-app-kafka-controller-2:9093,3@chat-app-kafka-controller-3:9093
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
    ports:
      - 49092:9092
    networks:
      - chat-app-kafka-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server broker-3:19092 || exit 1"]
      retries: 3
      start_period: 15s
      start_interval: 3s
      interval: 30s
      timeout: 5s
    depends_on:
      - controller-1
      - controller-2
      - controller-3

  topics-init:
    image: apache/kafka:latest
    container_name: chat-app-kafka-topics-init
    labels:
      - 'custom.project=chat'
      - 'custom.service=topics-init'
    volumes:
      - ../scripts/init_topics.sh:/init-topics.sh:ro
    entrypoint: [ "bash", "/init-topics.sh" ]
    environment:
      TOPICS: >
        asset-resource-delete:3:3
        participant-resource-update:3:3
        message-resource-created:3:3
      BOOTSTRAP: broker-1:19092
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/topics-created"]
      retries: 3
      start_period: 15s
      start_interval: 3s
      interval: 5s
      timeout: 5s
    networks:
      - chat-app-kafka-network
    depends_on:
      - broker-1

volumes:
  chat-app-db-data:
    external: true
    name: test_chat-app-db-data

networks:
  chat-app-db-network:
    driver: bridge
    name: chat-app-db-network
  chat-app-id-generator-network:
    driver: bridge
    name: chat-app-id-generator-network
  chat-app-kafka-network:
    driver: bridge
    name: chat-app-kafka-network
